name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # About 7 min on a 24-core machine; hosted runners have 4 cores
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The suite is offline (HTTP is mocked) and forces CPU, so no API keys, data or GPU are needed
      - name: Run tests
        run: pytest tests -q -p no:cacheprovider
